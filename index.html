<!DOCTYPE html>
<html lang="uk">
<head>
    <link rel="icon" href="favicon.png" type="image/png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>:D</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <!-- Варіативний шрифт Syne: дозволяє плавно змінювати ширину літер -->
    <link href="https://googleapis.com/css2?family=Syne:wght@700..800&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #050505; /* Глибокий темний фон */
            color: #fff;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-family: "Syne", sans-serif;
            font-size: clamp(4rem, 18vw, 14rem);
            text-align: center;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.03em;
            
            /* Гіпнотичний ефект плавного розтягування та стиснення */
            animation: kinetic-stretch 6s infinite ease-in-out;
        }

        @keyframes kinetic-stretch {
            0%, 100% {
                letter-spacing: -0.03em;
                transform: scaleX(1);
                filter: blur(0px);
            }
            50% {
                letter-spacing: 0.15em;
                transform: scaleX(1.05);
                filter: blur(1px); /* Легке розмиття у піку для загадковості */
                color: #e0e0e0;
            }
        }
    </style>
</head>
<body>
    <h1>Hi!</h1>
</body>
</html>
